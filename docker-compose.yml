services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expert-frontend
    restart: always
    ports:
      - "4100:3000"
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://expert-backend:8000
      - API_KEY_FILE=/run/secrets/api_key
    networks:
      - internet
      - intranet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.expert-frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.expert-frontend.entrypoints=websecure"
      - "traefik.http.routers.expert-frontend.tls=true"
      - "traefik.http.services.expert-frontend.loadbalancer.server.port=3000"
    depends_on:
      - backend
    secrets:
      - api_key

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expert-backend
    restart: always
    environment:
      - POSTGRES_USER=expert
      # Note: set POSGTRES_HOST to your external database in production.
      - POSTGRES_HOST=expert-db
      - POSTGRES_DB=expert
    volumes:
      - ./backend/schemas:/app/schemas
      - ./backend/backups:/app/backups
    networks:
      - internet
      - intranet
    secrets:
      - gemini_api_key
      - db_password
      - api_key

networks:
  internet:
    external: true
  intranet:
    external: true

secrets:
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt
  db_password:
    file: ./secrets/db_password.txt
  api_key:
    file: ./secrets/api_key.txt
